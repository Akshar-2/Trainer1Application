<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>TrainHub - Login</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
        body{background:#1a9df0;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
        .card{background:white;width:100%;max-width:400px;padding:35px;border-radius:12px;box-shadow:0 15px 35px rgba(0,0,0,0.25);text-align:center}
        .logo{font-size:32px;font-weight:800;color:#0090e7;margin-bottom:8px}
        .card h2{font-size:26px;margin-bottom:5px;color:#222}
        .card p{color:#888;font-size:14px;margin-bottom:20px}
        .field{margin-bottom:14px;text-align:left}
        .field label{display:block;font-weight:600;margin-bottom:6px;font-size:14px;color:#333}
        .field input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;background:#f5f5f5;outline:none;font-size:14px}
        .field input:focus{border-color:#0090e7;background:white}
        .row{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin:12px 0 18px;gap:10px}
        .remember{display:flex;align-items:center;gap:5px;white-space:nowrap;color:#555}
        .remember input{width:15px;height:15px;margin:0}
        .row a{color:#0090e7;text-decoration:none;white-space:nowrap}
        .btn{width:100%;padding:13px;background:#0090e7;color:white;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}
        .btn:hover{background:#0077c8}
        .signup{margin-top:18px;font-size:14px;color:#555}
        .signup a{color:#0090e7;text-decoration:none;font-weight:600}
    </style>
</head>
<body>
<div class="card">
    <div class="logo">TrainHub</div>
    <h2>Welcome Back</h2>
    <p>Please sign in to your account</p>
    <form action="/login" method="post" autocomplete="off">
        <div class="field">
            <label>Username</label>
            <input type="text" name="username" placeholder="Enter username" required>
        </div>
        <div class="field">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password" required>
        </div>
        <div class="row">
            <label class="remember"><input type="checkbox"> Remember me</label>
            <a href="/forgot-password">Forgot Password?</a>
        </div>
        <button class="btn" type="submit">Sign In</button>
    </form>
    <div class="signup">Don't have an account? <a href="/signup">Sign Up</a></div>
</div>
</body>
</html>
